name: Supabase Keep-Alive
# 每天打正式庫 steven01 EIP 的 daily_maintenance RPC，登記一次 DB 活動，
# 防止免費版「7 天無活動」被暫停。在 GitHub 伺服器執行，不依賴本機開著。
# anon key 為可公開金鑰（與前端 src/integrations/supabase/client.ts 同一把，存取由 RLS 控管）。
on:
  schedule:
    - cron: "0 15 * * *" # 15:00 UTC = 23:00 台北
  workflow_dispatch: {}
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5 # job 層級後盾，避免罕見情況空等
    steps:
      - name: Ping steven01 EIP (iegkmncnvmmzllqkijxm)
        run: |
          curl -sS --fail --retry 3 --retry-all-errors \
            --connect-timeout 15 --max-time 60 \
            -X POST "https://iegkmncnvmmzllqkijxm.supabase.co/rest/v1/rpc/daily_maintenance" \
            -H "apikey: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImllZ2ttbmNudm1temxscWtpanhtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE2MTg3MTQsImV4cCI6MjA5NzE5NDcxNH0.yiEvBHimj2JWN674zI2_AH0BTHqFwucNfj-vkxNrplQ" \
            -H "Authorization: Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImllZ2ttbmNudm1temxscWtpanhtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE2MTg3MTQsImV4cCI6MjA5NzE5NDcxNH0.yiEvBHimj2JWN674zI2_AH0BTHqFwucNfj-vkxNrplQ" \
            -H "Content-Type: application/json" -d '{}'
